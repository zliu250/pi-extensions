name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and runs tests, nothing needs write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # npm test needs Node >= 22.19 for native TypeScript stripping.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
